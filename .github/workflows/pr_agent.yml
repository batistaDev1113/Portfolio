name: PR Agent (NVIDIA NIM)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    name: Run PR Agent (NVIDIA NIM) on pull requests and comments
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NVIDIA NIM exposes an OpenAI-compatible endpoint; use the openai/ prefix.
          config.model: "openai/deepseek-ai/deepseek-v4-flash"
          config.fallback_models: '[]'
          config.custom_model_max_tokens: "32000"
          config.num_retries: "6"
          config.ai_timeout: "300"
          OPENAI_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENAI.API_BASE: "https://integrate.api.nvidia.com/v1"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
