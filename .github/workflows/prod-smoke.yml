# Nightly 6-route prod smoke-test for the production Vercel deployment.
#
# Catches prod regressions even when no PR is in flight (e.g., a Vercel-side
# incident, a DNS issue, a silent feature-flag toggle, a post-deploy config
# drift) by running the same 6-route curl smoke battery that was validated
# manually during PR #79 (Tailwind v3 \u2192 v4) and PR #83 (Drop babel toolchain)
# gate-acceptance phases.
#
# Triggers:
#   - cron: nightly at 06:00 UTC (1:00 AM EST / 2:00 AM EDT)
#   - workflow_dispatch: manual ad-hoc run from GitHub UI / CLI / API,
#     optional PROD_URL input override
#
# Failure semantics:
#   - Routes 1\u20135 (GET /, sitemap.xml, robots.txt, /api/contact, non-existent):
#     exact-match expected status.  Mismatch = fail.
#   - Route 6 (POST /api/contact with omission JSON): the route-handler-runtime
#     crash signal is HTTP 500.  HTTP 200/4xx is acceptable because the route
#     is documented to return 400 for missing fields and the smoke payload
#     deliberately omits `full_name` and `textarea`.  HTTP 500 = fail.
#
# Hardening (post-PR-#85 code-review):
#   - explicit `permissions: {}`  \u2192 zero GITHUB_TOKEN grants, future-proof
#     against accidental over-broad permission inheritance if a step is added.
#   - per-route `mktemp` body file  \u2192 on failure the ::error annotation shows
#     the *failing* route's body, not the previous route's response.
#   - `curl --max-time 30` per call  \u2192 Vercel CDN hang is bounded to 30s,
#     not unbounded (would otherwise consume the 5-min job timeout).
#   - `curl -L` per call → follows Vercel's apex→www 308 canonicalization
#     transparently. Without `-L`, the http_code captured by `-w '%{http_code}'`
#     is the pre-redirect status (308), causing the exact-match `check_status`
#     assertion to fail. With `-L`, the captured code is the post-redirect
#     final status (200/405/404 etc.), matching the expected pattern. Required
#     because Vercel canonicalizes `yuniorbatista.com` (apex) →
#     `www.yuniorbatista.com` with HTTP 308.

name: prod-smoke

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      PROD_URL:
        description: 'Production URL to smoke-test (default: https://yuniorbatista.com)'
        required: false
        default: 'https://yuniorbatista.com'
        type: string

# Required for cron workflows that don't touch GITHUB_TOKEN: explicit
# zero-permissions block.  Default would over-grant (contents: read,
# pull-requests: read/write, etc.) and silently activate if any future
# step adds a `uses:` action.
permissions: {}

jobs:
  smoke-test:
    name: 6-route prod smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_URL: ${{ github.event.inputs.PROD_URL || 'https://yuniorbatista.com' }}
    steps:
      - name: 6-route curl smoke-test
        run: |
          set -euo pipefail
          PROD="${PROD_URL%/}"

          # check_status <url> <method> <expected> [body]
          # Per-curl --max-time 30 prevents Vercel CDN hang from blocking
          # until job timeout.  Body captured via per-route mktemp file
          # (cleaned-up on every exit path) so on failure the ::error
          # annotation shows the failing route's body, not the previous
          # route's response.
          check_status() {
            local url="$1"
            local method="$2"
            local expected="$3"
            local body_arg="${4:-}"
            local body_file
            body_file=$(mktemp)
            local actual
            if [ -n "$body_arg" ]; then
              actual=$(curl -sSL --max-redirs 3 --max-time 30 -o "$body_file" \
                -w '%{http_code}' \
                -X "$method" \
                -H 'Content-Type: application/json' \
                -d "$body_arg" \
                "$url")
            else
              actual=$(curl -sSL --max-redirs 3 --max-time 30 -o "$body_file" \
                -w '%{http_code}' \
                -X "$method" \
                "$url")
            fi
            if [ "$actual" != "$expected" ]; then
              echo "::error title=smoke regression::$method $url  expected=$expected  got=$actual"
              echo "--- response body (truncated to 800 bytes) ---"
              head -c 800 "$body_file" 2>/dev/null || echo '(body file unreadable)'
              echo
              echo "--- end body ---"
              rm -f "$body_file"
              return 1
            fi
            rm -f "$body_file"
            echo "PASS  $method $url  -> $actual (expected $expected)"
          }

          # check_not_500 <url> <method> [body]
          # The smoke POST deliberately omits `full_name` + `textarea` to
          # trigger the route's validation 400 branch deterministically.
          # The regression signal is HTTP 500 only (route-handler-runtime
          # crash); 200/4xx are both acceptable.
          check_not_500() {
            local url="$1"
            local method="$2"
            local body_arg="${3:-}"
            local body_file
            body_file=$(mktemp)
            local actual
            if [ -n "$body_arg" ]; then
              actual=$(curl -sSL --max-redirs 3 --max-time 30 -o "$body_file" \
                -w '%{http_code}' \
                -X "$method" \
                -H 'Content-Type: application/json' \
                -d "$body_arg" \
                "$url")
            else
              actual=$(curl -sSL --max-redirs 3 --max-time 30 -o "$body_file" \
                -w '%{http_code}' \
                -X "$method" \
                "$url")
            fi
            if [ "$actual" = "500" ]; then
              echo "::error title=route handler crashed::$method $url  got=500 (body: $(head -c 200 "$body_file" 2>/dev/null || echo 'unreadable'))"
              rm -f "$body_file"
              return 1
            fi
            rm -f "$body_file"
            echo "PASS  $method $url  -> $actual (not 500)"
          }

          echo "=== Smoke-testing production URL: ${PROD} ==="
          echo

          check_status "${PROD}/" "GET" "200"
          check_status "${PROD}/sitemap.xml" "GET" "200"
          check_status "${PROD}/robots.txt" "GET" "200"
          check_status "${PROD}/api/contact" "GET" "405"
          check_status "${PROD}/non-existent-test-path-xyz123" "GET" "404"
          check_not_500 "${PROD}/api/contact" "POST" \
            '{"name":"cron","email":"cron@test.local","message":"nightly cron prod smoke","subject":"smoke","access_key":"placeholder-not-real"}'

          echo
          echo "=== All 6 routes passed ==="
